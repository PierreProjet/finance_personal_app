[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-foyer"
version = "0.1.0"
description = "Application locale et sécurisée de gestion des finances personnelles et du foyer."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Finance Foyer"}]
dependencies = [
  "PySide6>=6.8,<7",
  "SQLAlchemy>=2.0,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "keyring>=25,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "pyinstaller>=6.15,<7",
]

[project.scripts]
finance-foyer = "finance_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
