name: Build Windows executable
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: pyinstaller --noconfirm --clean --windowed --name finance --paths src src/finance_app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: finance-windows
          path: dist/finance/
